server {
    listen 80;
    server_name localhost;

    # Forward real client IP to Laravel (needed for geolocation)
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # /api/* → Laravel via PHP-FPM
    location /api {
        root /var/www/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass   php:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME /var/www/backend/public/index.php;
            include        fastcgi_params;
        }
    }

    # Everything else → React dev server (Vite)
    location / {
        proxy_pass         http://react:5173;
        proxy_http_version 1.1;
        # These two lines are needed for Vite's hot-reload websocket
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}
