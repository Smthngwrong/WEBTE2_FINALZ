server {
    listen 80;
    server_name localhost;

    # Forward real client IP to Laravel, used by request logging/geolocation.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # /api/* -> Laravel via PHP-FPM.
    location ^~ /api {
        include        fastcgi_params;
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param  SCRIPT_NAME /index.php;
        fastcgi_param  REQUEST_URI $request_uri;
    }

    # Everything else -> React dev server (Vite).
    location / {
        proxy_pass         http://react:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}
